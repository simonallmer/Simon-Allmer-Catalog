<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allmer Studios Network | Graph Theory Visualization</title>
    <meta name="description" content="Interactive network visualization of Allmer Studios ecosystem">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-particles"></div>

    <div class="container">
        <header class="header">
            <a href="https://simonallmer.com" class="back-btn glass-panel" target="_top">Back to <span class="logo-font">SA</span></a>

            <!-- Header Branding -->
            <div class="header-branding" role="button" tabindex="0" aria-label="Open Simon Allmer Entertainment details" style="margin-bottom: 3rem; padding-top: 5rem; display: flex; flex-direction: column; align-items: center;">
                <img src="SimonAllmerLogoRightProportionsWhite.png" alt="Simon Allmer" style="height: 40px; width: auto; margin-bottom: 1.5rem;">
                <h1 style="font-family: 'Futura', var(--font-family); font-size: 1.25rem; letter-spacing: 0.5em; color: white; font-weight: 300; text-transform: uppercase; margin: 0;">
                    Catalog</h1>
            </div>



        </header>
        
        <div class="view-switch glass-panel">
            <button class="switch-btn active" data-mode="studios">Studios</button>
            <div class="switch-divider"></div>
            <button class="switch-btn" data-mode="brands">Brands</button>
        </div>

        <div class="canvas-wrapper">
            <canvas id="networkCanvas"></canvas>

            <!-- Node popup removed, replaced by details panel -->
        </div>

        <div class="details-panel glass-panel" id="details-panel">
            <div class="popup-header">
                <h3 id="panel-title">Select a Node</h3>
                <button id="panel-close" class="panel-close-btn">&times;</button>
            </div>
            <div id="panel-content">
                <p id="panel-desc" class="placeholder-text">Click on any node to view details.</p>
                <div id="panel-dynamic-content"></div>
            </div>
            <a id="panel-link" href="#" target="_blank" class="panel-link hidden">Access</a>
            <div id="panel-social-links" class="social-links hidden" aria-label="Social links"></div>
        </div>
    </div>

    <div class="catalogue glass-panel" id="catalogue">
        <div class="catalogue-content" id="catalogue-content">
            <!-- Catalogue items will be dynamically inserted here -->
        </div>
    </div>


    <div class="controls glass-panel">
        <button class="control-btn" id="resetBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                <path d="M21 3v5h-5" />
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                <path d="M3 21v-5h5" />
            </svg>
            Reset Layout
        </button>
    </div>

    <!-- Footer removed as per request -->

    <script src="app.js"></script>
</body>

</html>

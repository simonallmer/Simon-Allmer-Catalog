<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Oracle | Simon Allmer</title>
    <meta name="description" content="The Oracle — an intuitive recommender for the Allmer catalog.">
    <link rel="stylesheet" href="oracle.css">
</head>

<body>
    <!-- Ambient atmosphere -->
    <div class="dust" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <!-- The descending well. The camera (column) travels down through it. -->
    <div class="well" id="well">
        <div class="column" id="column"></div>
    </div>

    <!-- Chrome -->
    <header class="oracle-header">
        <a href="https://simonallmer.com" class="back-btn" target="_top">Back to <span class="logo-font">SA</span></a>
        <a class="brand" href="https://simonallmer.com/center" target="_top" title="Enter the Center">
            <img src="assets/SimonAllmerCenterLogo.png" alt="Simon Allmer Center" class="brand-mark">
        </a>
    </header>

    <!-- Elevator — ride back and forth through the descent -->
    <div class="elevator" role="group" aria-label="Navigate levels">
        <button class="elev-btn" id="elUp" aria-label="Go back up a level" title="Back (↑)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M7 14l5-5 5 5" />
            </svg>
        </button>
        <div class="elev-floors" id="elevFloors" aria-hidden="true"></div>
        <button class="elev-btn" id="elDown" aria-label="Go forward down a level" title="Forward (↓)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M7 10l5 5 5-5" />
            </svg>
        </button>
    </div>

    <script src="oracle.js"></script>
</body>

</html>
